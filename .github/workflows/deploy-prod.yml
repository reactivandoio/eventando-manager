name: Project Deploy

# Roda no runner self-hosted do thor (labels self-hosted e thor), no próprio servidor:
# make update (git pull, yarn, build, pm2 restart) no diretório do projeto, com o .env que
# já está lá.
#
# Só disparo manual por enquanto. Para deploy a cada push na main, depois do ok do Pedro:
#   push:
#     branches: [main]
# Nunca use pull_request ou pull_request_target com este runner: ele roda em produção.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, thor]
    environment: production
    env:
      # Caminho absoluto do projeto no servidor, por exemplo /root/projects/eventando-manager.
      APP_DIR: ${{ vars.APP_DIR }}
    steps:
      - name: make update
        run: |
          [ -n "$APP_DIR" ] || { echo "Defina a variável APP_DIR (caminho absoluto do projeto no servidor)." >&2; exit 1; }
          [ -d "$APP_DIR/.git" ] && [ -f "$APP_DIR/Makefile" ] || { echo "$APP_DIR não parece o projeto (sem .git ou Makefile)." >&2; exit 1; }
          cd "$APP_DIR"
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then set +u; . "$NVM_DIR/nvm.sh"; fi
          make update < /dev/null
